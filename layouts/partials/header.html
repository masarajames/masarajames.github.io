<nav role="navigation" aria-label="Main navigation">
  <style>
    /* Embedded CSS - only affects this nav */
    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.25rem 0;               /* Keep total nav height = --nav-h in assets/css/custom.css */
      max-width: 1200px;
      margin: 0 auto;
    }

    .logo {
      flex-shrink: 0;
    }

    .logo img {
      display: block;
      height: 64px;
      width: auto;
    }

    .nav-links {
      display: flex;
      list-style: none;
      margin: 0;
      padding: 0;
      justify-content: center;          /* Centers the menu items */
      flex-grow: 1;                     /* Takes space between logo and button */
      gap: 2.5rem;                      /* Space between links - feel free to adjust */
    }

    .nav-links li a {
      text-decoration: none;
      color: #41acdd;                   /* Light blue */
      font-size: 1.1rem;
      font-weight: 700;                 /* Bolder text */
      padding: 0.6rem 1rem;
      transition: all 0.3s ease;
      border-radius: 6px;
    }

    /* Cyan glow on hover and for the current page, matching the site's accent */
    .nav-links li a:hover,
    .nav-links li a[aria-current="page"] {
      background-color: rgba(0, 212, 255, 0.12);   /* Faint cyan tint */
      color: #00d4ff;                               /* Site accent cyan */
      text-shadow: 0 0 8px rgba(0, 212, 255, 0.6);  /* Soft terminal glow */
    }

    /* Underline grows in on hover */
    .nav-links li a::after {
      content: '';
      display: block;
      width: 0;
      height: 3px;
      background: #00d4ff;
      transition: width 0.3s ease;
      margin: 0 auto;
    }

    .nav-links li a:hover::after,
    .nav-links li a[aria-current="page"]::after {
      width: 60%;
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #41acdd;
    }

    /* No grey/white flash when tapping on phones */
    .mobile-menu-btn,
    .nav-links li a {
      -webkit-tap-highlight-color: transparent;
    }

    /* Mobile responsive behavior */
    @media (max-width: 768px) {
      .nav-links {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: rgba(26, 26, 46, 0.98);   /* Same dark navy as the nav bar */
        padding: 1rem;
        box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      }

      .nav-links.active {
        display: flex;
      }

      .mobile-menu-btn {
        display: block;
      }

      .nav-container {
        justify-content: space-between;
      }
    }
  </style>

  <div class="container">
    <div class="nav-container">
      <!-- Logo on the left -->
      <a href="{{ "/" | relURL }}" class="logo" aria-label="{{ .Site.Title }} - Home">
        <img src="{{ "images/nav.png" | relURL }}"
             alt="{{ .Site.Title }} logo"
             width="43" height="64">
      </a>

      <!-- Centered menu items -->
      {{/* aria-current marks the section you are on, which also highlights it */}}
      {{ $section := .Section }}
      <ul class="nav-links" id="nav-menu">
        <li><a href="{{ "/" | relURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>{{ i18n "home" }}</a></li>
        <li><a href="{{ "posts/" | relURL }}"{{ if or (eq $section "posts") (eq $section "categories") (eq $section "tags") }} aria-current="page"{{ end }}>{{ i18n "blog" }}</a></li>
        <li><a href="{{ "about/" | relURL }}"{{ if eq .RelPermalink ("about/" | relURL) }} aria-current="page"{{ end }}>{{ i18n "about" }}</a></li>
        <li><a href="https://rxresu.me/masarajames02/masara" target="_blank" rel="noopener">{{ i18n "resume" }}</a></li>
      </ul>

      <button class="mobile-menu-btn" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle navigation menu">☰</button>
    </div>
  </div>
</nav>
