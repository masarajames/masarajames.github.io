<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f5a623"/></marker>
  </defs>
  <rect width="1000" height="330" rx="16" fill="#12121f"/>
  <text x="500" y="38" text-anchor="middle" font-size="22" fill="#f0f0f0" font-weight="bold">Inside Logstash: input → filter → output</text>

  <g font-size="14">
    <rect x="30" y="75" width="170" height="150" rx="12" fill="#1a1a2e" stroke="#00d4ff"/>
    <text x="115" y="105" text-anchor="middle" fill="#00d4ff">SOURCE</text>
    <text x="115" y="140" text-anchor="middle" fill="#f0f0f0">alerts.json</text>
    <text x="115" y="165" text-anchor="middle" fill="#888" font-size="12">/var/ossec/logs/</text>
    <text x="115" y="183" text-anchor="middle" fill="#888" font-size="12">alerts/</text>

    <rect x="250" y="60" width="500" height="180" rx="14" fill="none" stroke="#f5a623" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="500" y="85" text-anchor="middle" fill="#f5a623">LOGSTASH PIPELINE (wazuh-elasticsearch.conf)</text>

    <rect x="270" y="105" width="140" height="115" rx="10" fill="#222238" stroke="#f5a623"/>
    <text x="340" y="132" text-anchor="middle" fill="#f0f0f0" font-weight="bold">input</text>
    <text x="340" y="158" text-anchor="middle" fill="#aaa" font-size="12">file plugin</text>
    <text x="340" y="178" text-anchor="middle" fill="#aaa" font-size="12">mode: tail</text>
    <text x="340" y="198" text-anchor="middle" fill="#aaa" font-size="12">codec: json</text>

    <rect x="430" y="105" width="140" height="115" rx="10" fill="#222238" stroke="#f5a623"/>
    <text x="500" y="132" text-anchor="middle" fill="#f0f0f0" font-weight="bold">filter</text>
    <text x="500" y="158" text-anchor="middle" fill="#aaa" font-size="12">optional:</text>
    <text x="500" y="178" text-anchor="middle" fill="#aaa" font-size="12">geoip, drop,</text>
    <text x="500" y="198" text-anchor="middle" fill="#aaa" font-size="12">add fields</text>

    <rect x="590" y="105" width="140" height="115" rx="10" fill="#222238" stroke="#f5a623"/>
    <text x="660" y="132" text-anchor="middle" fill="#f0f0f0" font-weight="bold">output</text>
    <text x="660" y="158" text-anchor="middle" fill="#aaa" font-size="12">elasticsearch</text>
    <text x="660" y="178" text-anchor="middle" fill="#aaa" font-size="12">TLS + keystore</text>
    <text x="660" y="198" text-anchor="middle" fill="#aaa" font-size="12">daily index</text>

    <rect x="800" y="75" width="170" height="150" rx="12" fill="#1a1a2e" stroke="#f5a623"/>
    <text x="885" y="105" text-anchor="middle" fill="#f5a623">DESTINATION</text>
    <text x="885" y="140" text-anchor="middle" fill="#f0f0f0">Elasticsearch</text>
    <text x="885" y="165" text-anchor="middle" fill="#888" font-size="12">wazuh-alerts-</text>
    <text x="885" y="183" text-anchor="middle" fill="#888" font-size="12">4.x-YYYY.MM.dd</text>
  </g>

  <g stroke="#f5a623" stroke-width="2.5" marker-end="url(#g)">
    <line x1="200" y1="150" x2="265" y2="150"/>
    <line x1="410" y1="162" x2="426" y2="162"/>
    <line x1="570" y1="162" x2="586" y2="162"/>
    <line x1="750" y1="150" x2="796" y2="150"/>
  </g>

  <text x="500" y="285" text-anchor="middle" font-size="14" fill="#ccc">Logstash remembers how far it has read (the "sincedb"),</text>
  <text x="500" y="307" text-anchor="middle" font-size="14" fill="#ccc">so a restart continues where it stopped instead of re-sending everything.</text>
</svg>
