  <g fill="#00d4ff" opacity="0.8">
    <rect x="50" y="320" width="22" height="30"/><rect x="80" y="300" width="22" height="50"/><rect x="110" y="310" width="22" height="40"/><rect x="140" y="290" width="22" height="60"/><rect x="170" y="315" width="22" height="35"/><rect x="200" y="305" width="22" height="45"/><rect x="230" y="280" width="22" height="70"/><rect x="260" y="300" width="22" height="50"/><rect x="290" y="310" width="22" height="40"/><rect x="320" y="295" width="22" height="55"/><rect x="350" y="318" width="22" height="32"/><rect x="380" y="306" width="22" height="44"/><rect x="410" y="296" width="22" height="54"/><rect x="440" y="312" width="22" height="38"/><rect x="470" y="300" width="22" height="50"/><rect x="500" y="288" width="22" height="62"/><rect x="530" y="308" width="22" height="42"/><rect x="560" y="316" width="22" height="34"/><rect x="590" y="302" width="22" height="48"/><rect x="620" y="294" width="22" height="56"/><rect x="650" y="310" width="22" height="40"/><rect x="680" y="300" width="22" height="50"/><rect x="710" y="315" width="22" height="35"/><rect x="740" y="305" width="22" height="45"/><rect x="770" y="298" width="22" height="52"/><rect x="800" y="312" width="22" height="38"/><rect x="830" y="304" width="22" height="46"/><rect x="860" y="309" width="22" height="41"/><rect x="890" y="300" width="22" height="50"/><rect x="920" y="316" width="22" height="34"/>
