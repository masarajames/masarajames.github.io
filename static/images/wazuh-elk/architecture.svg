<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#00d4ff"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f5a623"/></marker>
  </defs>
  <rect width="1000" height="620" rx="16" fill="#12121f"/>
  <text x="500" y="38" text-anchor="middle" font-size="22" fill="#f0f0f0" font-weight="bold">Wazuh + ELK: the full architecture</text>

  <!-- Endpoints -->
  <rect x="25" y="70" width="190" height="470" rx="12" fill="#1a1a2e" stroke="#444" stroke-dasharray="6 4"/>
  <text x="120" y="98" text-anchor="middle" font-size="16" fill="#aaa">ENDPOINTS</text>
  <g font-size="14">
    <rect x="45" y="120" width="150" height="70" rx="10" fill="#222238" stroke="#00d4ff"/>
    <text x="120" y="150" text-anchor="middle" fill="#f0f0f0">Linux server</text>
    <text x="120" y="172" text-anchor="middle" fill="#00d4ff">wazuh-agent</text>
    <rect x="45" y="215" width="150" height="70" rx="10" fill="#222238" stroke="#00d4ff"/>
    <text x="120" y="245" text-anchor="middle" fill="#f0f0f0">Windows host</text>
    <text x="120" y="267" text-anchor="middle" fill="#00d4ff">wazuh-agent</text>
    <rect x="45" y="310" width="150" height="70" rx="10" fill="#222238" stroke="#00d4ff"/>
    <text x="120" y="340" text-anchor="middle" fill="#f0f0f0">Web / DB server</text>
    <text x="120" y="362" text-anchor="middle" fill="#00d4ff">wazuh-agent</text>
    <rect x="45" y="405" width="150" height="70" rx="10" fill="#222238" stroke="#888"/>
    <text x="120" y="435" text-anchor="middle" fill="#f0f0f0">Firewall/switch</text>
    <text x="120" y="457" text-anchor="middle" fill="#aaa">syslog (no agent)</text>
  </g>

  <!-- Wazuh server host -->
  <rect x="290" y="70" width="330" height="470" rx="12" fill="#1a1a2e" stroke="#00d4ff" stroke-width="2"/>
  <text x="455" y="98" text-anchor="middle" font-size="16" fill="#00d4ff">HOST 1 · WAZUH (all-in-one)</text>
  <g font-size="14">
    <rect x="315" y="120" width="280" height="95" rx="10" fill="#222238" stroke="#00d4ff"/>
    <text x="455" y="148" text-anchor="middle" fill="#f0f0f0" font-weight="bold">Wazuh server (manager)</text>
    <text x="455" y="172" text-anchor="middle" fill="#aaa">decoders → rules → alerts</text>
    <text x="455" y="196" text-anchor="middle" fill="#f5a623">writes alerts.json</text>

    <rect x="315" y="245" width="130" height="60" rx="10" fill="#222238" stroke="#00d4ff"/>
    <text x="380" y="272" text-anchor="middle" fill="#f0f0f0">Filebeat</text>
    <text x="380" y="292" text-anchor="middle" fill="#aaa">shipper</text>

    <rect x="465" y="245" width="130" height="60" rx="10" fill="#222238" stroke="#f5a623" stroke-width="2"/>
    <text x="530" y="272" text-anchor="middle" fill="#f5a623">Logstash</text>
    <text x="530" y="292" text-anchor="middle" fill="#aaa">added by us</text>

    <rect x="315" y="335" width="280" height="70" rx="10" fill="#222238" stroke="#00d4ff"/>
    <text x="455" y="365" text-anchor="middle" fill="#f0f0f0" font-weight="bold">Wazuh indexer</text>
    <text x="455" y="387" text-anchor="middle" fill="#aaa">stores alerts · :9200</text>

    <rect x="315" y="435" width="280" height="70" rx="10" fill="#222238" stroke="#00d4ff"/>
    <text x="455" y="465" text-anchor="middle" fill="#f0f0f0" font-weight="bold">Wazuh dashboard</text>
    <text x="455" y="487" text-anchor="middle" fill="#aaa">web UI · https :443</text>
  </g>

  <!-- ELK host -->
  <rect x="700" y="70" width="275" height="470" rx="12" fill="#1a1a2e" stroke="#f5a623" stroke-width="2"/>
  <text x="837" y="98" text-anchor="middle" font-size="16" fill="#f5a623">HOST 2 · ELASTIC STACK</text>
  <g font-size="14">
    <rect x="725" y="215" width="225" height="90" rx="10" fill="#222238" stroke="#f5a623"/>
    <text x="837" y="247" text-anchor="middle" fill="#f0f0f0" font-weight="bold">Elasticsearch</text>
    <text x="837" y="270" text-anchor="middle" fill="#aaa">wazuh-alerts-4.x-*</text>
    <text x="837" y="290" text-anchor="middle" fill="#aaa">https :9200</text>
    <rect x="725" y="365" width="225" height="90" rx="10" fill="#222238" stroke="#f5a623"/>
    <text x="837" y="397" text-anchor="middle" fill="#f0f0f0" font-weight="bold">Kibana</text>
    <text x="837" y="420" text-anchor="middle" fill="#aaa">dashboards · :5601</text>
    <text x="837" y="440" text-anchor="middle" fill="#aaa">SOC view</text>
  </g>

  <!-- Arrows: agents to manager -->
  <g stroke="#00d4ff" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M195,155 L310,160"/>
    <path d="M195,250 L310,180"/>
    <path d="M195,345 L310,195"/>
  </g>
  <path d="M195,440 L310,205" stroke="#888" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="252" y="128" text-anchor="middle" font-size="12" fill="#00d4ff">1514/tcp</text>
  <text x="252" y="143" text-anchor="middle" font-size="11" fill="#888">AES encrypted</text>
  <text x="235" y="470" font-size="11" fill="#888">514/udp</text>

  <!-- Manager to filebeat/logstash -->
  <path d="M380,215 L380,240" stroke="#00d4ff" stroke-width="2" marker-end="url(#a)"/>
  <path d="M530,215 L530,240" stroke="#f5a623" stroke-width="2" marker-end="url(#g)"/>
  <path d="M380,305 L380,330" stroke="#00d4ff" stroke-width="2" marker-end="url(#a)"/>
  <path d="M455,405 L455,430" stroke="#00d4ff" stroke-width="2" marker-end="url(#a)"/>

  <!-- Logstash to ES, ES to Kibana -->
  <path d="M595,275 L720,260" stroke="#f5a623" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="657" y="252" text-anchor="middle" font-size="12" fill="#f5a623">TLS</text>
  <path d="M837,305 L837,360" stroke="#f5a623" stroke-width="2" marker-end="url(#g)"/>

  <!-- Legend -->
  <g font-size="13">
    <line x1="60" y1="580" x2="100" y2="580" stroke="#00d4ff" stroke-width="3"/>
    <text x="110" y="585" fill="#ccc">Wazuh's built-in path</text>
    <line x1="380" y1="580" x2="420" y2="580" stroke="#f5a623" stroke-width="3"/>
    <text x="430" y="585" fill="#ccc">The Logstash → ELK path we add</text>
  </g>
</svg>
