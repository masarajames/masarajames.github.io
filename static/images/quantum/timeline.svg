<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
  <rect width="1000" height="470" rx="16" fill="#12121f"/>
  <text x="500" y="40" text-anchor="middle" font-size="22" fill="#f0f0f0" font-weight="bold">Quantum vs. crypto: the timeline so far</text>

  <line x1="50" y1="235" x2="975" y2="235" stroke="#555" stroke-width="3"/>
  <!-- today marker -->
  <line x1="630" y1="75" x2="630" y2="400" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="630" y="425" text-anchor="middle" font-size="14" fill="#a6e3a1" font-weight="bold">WE ARE HERE · 2026</text>

  <g font-size="13">
    <!-- above: hardware -->
    <text x="50" y="75" fill="#00d4ff" font-size="14">HARDWARE ▼</text>

    <circle cx="90" cy="235" r="7" fill="#00d4ff"/>
    <line x1="90" y1="228" x2="90" y2="130" stroke="#00d4ff"/>
    <text x="90" y="105" text-anchor="middle" fill="#f0f0f0">2019</text>
    <text x="90" y="123" text-anchor="middle" fill="#aaa">Sycamore</text>

    <circle cx="395" cy="235" r="7" fill="#00d4ff"/>
    <line x1="395" y1="228" x2="395" y2="150" stroke="#00d4ff"/>
    <text x="395" y="105" text-anchor="middle" fill="#f0f0f0">Dec 2024</text>
    <text x="395" y="123" text-anchor="middle" fill="#aaa">Willow: errors drop</text>
    <text x="395" y="141" text-anchor="middle" fill="#aaa">as code grows</text>

    <circle cx="545" cy="235" r="7" fill="#00d4ff"/>
    <line x1="545" y1="228" x2="545" y2="180" stroke="#00d4ff"/>
    <text x="545" y="155" text-anchor="middle" fill="#f0f0f0">2025</text>
    <text x="545" y="173" text-anchor="middle" fill="#aaa">Helios: 48 logical</text>

    <circle cx="760" cy="235" r="7" fill="#00d4ff" fill-opacity="0.4" stroke="#00d4ff"/>
    <line x1="760" y1="228" x2="760" y2="150" stroke="#00d4ff" stroke-dasharray="4 4"/>
    <text x="760" y="105" text-anchor="middle" fill="#f0f0f0">2029 (plan)</text>
    <text x="760" y="123" text-anchor="middle" fill="#aaa">IBM Starling</text>
    <text x="760" y="141" text-anchor="middle" fill="#aaa">~200 logical</text>

    <!-- below: crypto -->
    <text x="50" y="395" fill="#f5a623" font-size="14">CRYPTO ▲</text>

    <circle cx="110" cy="235" r="7" fill="#f5a623"/>
    <line x1="110" y1="242" x2="110" y2="290" stroke="#f5a623"/>
    <text x="110" y="310" text-anchor="middle" fill="#f0f0f0">2019</text>
    <text x="110" y="328" text-anchor="middle" fill="#aaa">RSA needs ~20M</text>
    <text x="110" y="346" text-anchor="middle" fill="#aaa">qubits (Gidney)</text>

    <circle cx="330" cy="235" r="7" fill="#f5a623"/>
    <line x1="330" y1="242" x2="330" y2="290" stroke="#f5a623"/>
    <text x="330" y="310" text-anchor="middle" fill="#f0f0f0">Aug 2024</text>
    <text x="330" y="328" text-anchor="middle" fill="#aaa">NIST PQC standards</text>
    <text x="330" y="346" text-anchor="middle" fill="#aaa">FIPS 203/204/205</text>

    <circle cx="470" cy="235" r="7" fill="#ff5c5c"/>
    <line x1="470" y1="242" x2="470" y2="360" stroke="#ff5c5c"/>
    <text x="470" y="378" text-anchor="middle" fill="#f0f0f0">May 2025</text>
    <text x="470" y="396" text-anchor="middle" fill="#aaa">&lt;1M qubits</text>

    <circle cx="835" cy="235" r="7" fill="#f5a623" fill-opacity="0.4" stroke="#f5a623"/>
    <line x1="835" y1="242" x2="835" y2="290" stroke="#f5a623" stroke-dasharray="4 4"/>
    <text x="835" y="310" text-anchor="middle" fill="#f0f0f0">2030</text>
    <text x="835" y="328" text-anchor="middle" fill="#aaa">RSA/ECC</text>
    <text x="835" y="346" text-anchor="middle" fill="#aaa">deprecated</text>

    <circle cx="938" cy="235" r="7" fill="#ff5c5c" fill-opacity="0.4" stroke="#ff5c5c"/>
    <line x1="938" y1="242" x2="938" y2="290" stroke="#ff5c5c" stroke-dasharray="4 4"/>
    <text x="938" y="310" text-anchor="middle" fill="#f0f0f0">2035</text>
    <text x="938" y="328" text-anchor="middle" fill="#aaa">disallowed</text>
    <text x="938" y="346" text-anchor="middle" fill="#aaa">(NIST plan)</text>
  </g>
  <text x="500" y="455" text-anchor="middle" font-size="12" fill="#666">Hardware dates are announcements. Crypto dates after 2026 are NIST's proposed roadmap (IR 8547).</text>
</svg>
