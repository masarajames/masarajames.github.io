<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
  <rect width="1000" height="470" rx="16" fill="#12121f"/>
  <text x="500" y="42" text-anchor="middle" font-size="22" fill="#f0f0f0" font-weight="bold">What a big quantum computer does to today's crypto</text>

  <!-- header -->
  <g font-size="14" fill="#888">
    <text x="40" y="90">ALGORITHM</text>
    <text x="330" y="90">USED FOR</text>
    <text x="580" y="90">QUANTUM ATTACK</text>
    <text x="800" y="90">VERDICT</text>
  </g>
  <line x1="30" y1="102" x2="970" y2="102" stroke="#333"/>

  <g font-size="15">
    <!-- RSA -->
    <rect x="30" y="112" width="940" height="62" rx="8" fill="#2a1418"/>
    <text x="40" y="140" fill="#f0f0f0" font-weight="bold">RSA</text>
    <text x="40" y="162" fill="#888" font-size="12">public-key</text>
    <text x="330" y="140" fill="#ccc">HTTPS, VPN,</text>
    <text x="330" y="162" fill="#ccc">email, signing</text>
    <text x="580" y="150" fill="#ff5c5c">Shor's algorithm</text>
    <text x="800" y="150" fill="#ff5c5c" font-weight="bold">✖ BROKEN</text>

    <!-- ECC -->
    <rect x="30" y="182" width="940" height="62" rx="8" fill="#2a1418"/>
    <text x="40" y="210" fill="#f0f0f0" font-weight="bold">ECC / ECDH / ECDSA</text>
    <text x="40" y="232" fill="#888" font-size="12">public-key</text>
    <text x="330" y="210" fill="#ccc">TLS, SSH, crypto</text>
    <text x="330" y="232" fill="#ccc">wallets, code signing</text>
    <text x="580" y="220" fill="#ff5c5c">Shor's algorithm</text>
    <text x="800" y="220" fill="#ff5c5c" font-weight="bold">✖ BROKEN</text>

    <!-- AES -->
    <rect x="30" y="252" width="940" height="62" rx="8" fill="#2a2414"/>
    <text x="40" y="280" fill="#f0f0f0" font-weight="bold">AES-128</text>
    <text x="40" y="302" fill="#888" font-size="12">symmetric</text>
    <text x="330" y="280" fill="#ccc">disk + data</text>
    <text x="330" y="302" fill="#ccc">encryption</text>
    <text x="580" y="290" fill="#f5a623">Grover (√ speed-up)</text>
    <text x="800" y="280" fill="#f5a623" font-weight="bold">~ WEAKENED</text>
    <text x="800" y="302" fill="#888" font-size="12">→ use AES-256</text>

    <!-- SHA -->
    <rect x="30" y="322" width="940" height="62" rx="8" fill="#142a1a"/>
    <text x="40" y="350" fill="#f0f0f0" font-weight="bold">AES-256 / SHA-256+</text>
    <text x="40" y="372" fill="#888" font-size="12">symmetric / hashing</text>
    <text x="330" y="350" fill="#ccc">bulk encryption,</text>
    <text x="330" y="372" fill="#ccc">integrity</text>
    <text x="580" y="360" fill="#a6e3a1">Grover (√ speed-up)</text>
    <text x="800" y="360" fill="#a6e3a1" font-weight="bold">✔ STILL FINE</text>
  </g>

  <text x="500" y="425" text-anchor="middle" font-size="14" fill="#ccc">Shor turns "impossible" into "a few days". Grover only halves the effective key length.</text>
  <text x="500" y="450" text-anchor="middle" font-size="14" fill="#ccc">So the emergency is public-key crypto, which is exactly what the internet runs on.</text>
</svg>
