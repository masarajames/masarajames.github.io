<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
  <defs>
    <radialGradient id="sph" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2a4a6a"/>
      <stop offset="100%" stop-color="#101828"/>
    </radialGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f5a623"/></marker>
  </defs>
  <rect width="1000" height="440" rx="16" fill="#12121f"/>

  <!-- Classical bit -->
  <text x="250" y="45" text-anchor="middle" font-size="22" fill="#f0f0f0" font-weight="bold">Classical bit</text>
  <text x="250" y="70" text-anchor="middle" font-size="14" fill="#888">a coin lying on the table</text>
  <circle cx="160" cy="185" r="62" fill="#1a1a2e" stroke="#00d4ff" stroke-width="3"/>
  <text x="160" y="200" text-anchor="middle" font-size="46" fill="#00d4ff" font-weight="bold">0</text>
  <text x="250" y="195" text-anchor="middle" font-size="18" fill="#888">OR</text>
  <circle cx="340" cy="185" r="62" fill="#1a1a2e" stroke="#00d4ff" stroke-width="3"/>
  <text x="340" y="200" text-anchor="middle" font-size="46" fill="#00d4ff" font-weight="bold">1</text>
  <text x="250" y="295" text-anchor="middle" font-size="15" fill="#ccc">Always exactly one value.</text>
  <text x="250" y="320" text-anchor="middle" font-size="15" fill="#ccc">Heads or tails. On or off.</text>

  <line x1="500" y1="40" x2="500" y2="400" stroke="#333" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Qubit -->
  <text x="750" y="45" text-anchor="middle" font-size="22" fill="#f0f0f0" font-weight="bold">Qubit</text>
  <text x="750" y="70" text-anchor="middle" font-size="14" fill="#888">a coin still spinning in the air</text>
  <circle cx="750" cy="195" r="100" fill="url(#sph)" stroke="#00d4ff" stroke-width="2"/>
  <ellipse cx="750" cy="195" rx="100" ry="28" fill="none" stroke="#00d4ff" stroke-opacity="0.5" stroke-dasharray="5 5"/>
  <line x1="750" y1="85" x2="750" y2="305" stroke="#555" stroke-width="1.5"/>
  <circle cx="750" cy="95" r="5" fill="#00d4ff"/>
  <circle cx="750" cy="295" r="5" fill="#00d4ff"/>
  <text x="768" y="92" font-size="18" fill="#00d4ff">|0⟩</text>
  <text x="768" y="310" font-size="18" fill="#00d4ff">|1⟩</text>
  <line x1="750" y1="195" x2="818" y2="130" stroke="#f5a623" stroke-width="3" marker-end="url(#a)"/>
  <circle cx="750" cy="195" r="4" fill="#f5a623"/>
  <text x="826" y="126" font-size="15" fill="#f5a623">state</text>
  <text x="750" y="350" text-anchor="middle" font-size="15" fill="#ccc">A blend of 0 and 1 (superposition)</text>
  <text x="750" y="375" text-anchor="middle" font-size="15" fill="#ccc">until you measure it, then it picks one.</text>

  <text x="500" y="425" text-anchor="middle" font-size="13" fill="#888">The arrow can point anywhere on the sphere. The closer to the top, the likelier you read 0.</text>
</svg>
