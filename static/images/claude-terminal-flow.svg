<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="900" height="300" rx="16" fill="#fafaf7"/>

  <!-- You -->
  <rect x="30" y="95" width="150" height="90" rx="12" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="105" y="135" text-anchor="middle" font-size="22" fill="#111">You</text>
  <text x="105" y="162" text-anchor="middle" font-size="14" fill="#555">plain English</text>

  <!-- Terminal -->
  <rect x="260" y="95" width="170" height="90" rx="12" fill="#1e1e2e" stroke="#1e1e2e" stroke-width="2"/>
  <text x="345" y="135" text-anchor="middle" font-size="22" fill="#a6e3a1">$ claude</text>
  <text x="345" y="162" text-anchor="middle" font-size="14" fill="#cdd6f4">your terminal</text>

  <!-- Claude -->
  <rect x="510" y="95" width="150" height="90" rx="12" fill="#ffffff" stroke="#d97757" stroke-width="3"/>
  <text x="585" y="135" text-anchor="middle" font-size="22" fill="#d97757">Claude</text>
  <text x="585" y="162" text-anchor="middle" font-size="14" fill="#555">thinks + plans</text>

  <!-- Tools -->
  <rect x="740" y="30" width="135" height="50" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="807" y="61" text-anchor="middle" font-size="16" fill="#111">read files</text>
  <rect x="740" y="115" width="135" height="50" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="807" y="146" text-anchor="middle" font-size="16" fill="#111">run commands</text>
  <rect x="740" y="200" width="135" height="50" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="807" y="231" text-anchor="middle" font-size="16" fill="#111">edit code</text>

  <!-- Arrows -->
  <line x1="180" y1="140" x2="255" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="140" x2="505" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="125" x2="735" y2="58" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="140" x2="735" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="155" x2="735" y2="222" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="450" y="280" text-anchor="middle" font-size="14" fill="#777">it asks before doing anything risky</text>
</svg>
